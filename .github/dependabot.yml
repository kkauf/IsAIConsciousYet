# Monthly npm updates, minor and patch grouped into one PR so CI tests them together; monthly keeps
# the notification mail to about two PRs a month (Konstantin, 2026-09-26: actionable mail only).
# Major versions are not proposed: they need deliberate work (TypeScript 7 and ESLint 10 failed CI on 2026-09-26).
# GitHub security updates are separate and still arrive.
# Cooldown: a release is proposed only once it is 7 days old, so auto-merge never takes a fresh, possibly
# hijacked release (npm supply-chain wave, October 2026). Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
