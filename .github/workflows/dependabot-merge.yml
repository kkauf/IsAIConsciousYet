# Merges Dependabot PRs once CI has passed on them: grouped npm minor/patch updates and
# GitHub Actions updates. npm major updates stay open for a person or agent to review.
name: Merge Dependabot updates
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/minor-and-patch') ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/'))
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        # --match-head-commit: never merge a commit CI did not test.
        run: gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$SHA"
