# Posts case files to X as the eye (pipeline/social.mjs): one post a run, three runs a day, so new case files and
# the backlog spread over the day. The 13:00 run also reads the reach of every post so far, by card variant.
# Design: docs/social-posting.md. Logs are public: no keys, no page text.
name: Social
on:
  schedule:
    - cron: "0 13,17,21 * * *" # 09:00, 13:00, 17:00 New York time (EDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pipeline # never alongside the pipeline run: both commit pipeline/state/spend.json
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Post the next case file
        run: node pipeline/social.mjs --summary summary.md --actionable actionable.txt
      - name: Reach by card variant (13:00 run only)
        run: |
          [ "$(date -u +%H)" = "13" ] || { echo "not the 13:00 run"; exit 0; }
          node pipeline/social.mjs --metrics --summary summary.md
      - name: Commit state
        if: always()
        run: |
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/state/social.json pipeline/state/spend.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Posted to X $(date -u +%F)" -m "$RUN_URL"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail the run when a post failed
        if: always()
        run: |
          if [ ! -s actionable.txt ]; then exit 0; fi
          cat actionable.txt
          exit 1
