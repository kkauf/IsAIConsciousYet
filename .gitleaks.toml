# The IndexNow key is public by design: it is served at public/<key>.txt so search engines can verify the host
# (pipeline/indexnow.mjs header). Allowlisted for that one rule and path only (agent decision 2026-11-06).
[extend]
useDefault = true

[[allowlists]]
description = "IndexNow key, public by design"
targetRules = ["generic-api-key"]
paths = ['''^pipeline/indexnow\.mjs$''']

# content/redirects.json maps case slugs to case slugs ("…-cyber-evaluation-access": "…"); the word "access" before a
# long hyphenated value trips generic-api-key. It holds no secrets (written by pipeline/merge-cases.mjs, 2026-11-08).
[[allowlists]]
description = "Case slug redirects"
targetRules = ["generic-api-key"]
paths = ['''^content/redirects\.json$''']
