# The IndexNow key is public by design: it is served at public/<key>.txt so search engines can verify the host
# (pipeline/indexnow.mjs header). Allowlisted for that one rule and path only (agent decision 2026-11-06).
[extend]
useDefault = true

[[allowlists]]
description = "IndexNow key, public by design"
targetRules = ["generic-api-key"]
paths = ['''^pipeline/indexnow\.mjs$''']

# Case slugs such as "2026-10-<org>-<topic>-access" trip generic-api-key: the key name holds "access" and the
# value is a slug (2026-11-08, content/redirects.json and pipeline/replay-test.mjs). Allowlisted only where the
# secret itself is a date slug, in those two files.
[[allowlists]]
description = "Case slugs (YYYY-MM-slug), not keys"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^content/redirects\.json$''', '''^pipeline/replay-test\.mjs$''']
regexes = ['''^[0-9]{4}-[0-9]{2}-[a-z0-9-]+$''']
